name: ci
on:
  push: { branches: [main, master] }
  pull_request: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.18", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm gen-docs && git diff --exit-code docs/commands/
      - run: pnpm --filter super-react-foundation build
      - run: pnpm audit --audit-level=high
      - run: npx --yes license-checker-rseidelsohn@5.0.1 --production --failOn "GPL;AGPL"
